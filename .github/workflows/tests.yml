name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  style:
    name: Style Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black formatter check
        run: black --check --diff vbwd/ tests/

      - name: Run Flake8 style check
        run: flake8 vbwd/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run Mypy type check
        run: mypy vbwd/ --ignore-missing-imports --no-error-summary

  unit:
    name: Unit Tests
    needs: style
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vbwd
          POSTGRES_PASSWORD: vbwd
          POSTGRES_DB: vbwd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install plugins (active set — 17 plugins)
        # Payment scope (2026-05-28 decision): demo instances only use
        # stripe + paypal + token_payment + invoice (core). The other 7
        # payment plugins (c2p2, conekta, mercado_pago, promptpay,
        # toss_payments, truemoney, yookassa) are FROZEN — repos kept
        # on the org for archival but excluded from CI + deploy until
        # someone explicitly un-freezes them. See
        # docs/dev_log/20260528/reports/01-payment-scope-freeze.md.
        # S15 — fail fast on any clone failure.
        # Naming: snake-cased local dir; ``token_payment`` is the one
        # kebab-cased repo (vbwd-plugin-token-payment).
        run: |
          set -euo pipefail
          declare -A REPO_OVERRIDES=(
            [token_payment]=token-payment
          )
          BACKEND_PLUGINS="analytics booking chat checkout cms discount email ghrm mailchimp meinchat paypal shipping_flat_rate shop stripe subscription tarot token_payment"
          for dir_name in $BACKEND_PLUGINS; do
            suffix="${REPO_OVERRIDES[$dir_name]:-$dir_name}"
            git clone --depth=1 \
              "https://github.com/VBWD-platform/vbwd-plugin-${suffix}.git" \
              "plugins/${dir_name}" \
              || { echo "::error::Failed to clone plugin ${dir_name} (repo vbwd-plugin-${suffix})"; exit 1; }
          done

      - name: Create plugins.json
        run: |
          python3 -c "
          import json, os
          plugins = {}
          for d in os.listdir('plugins'):
              if os.path.isfile(os.path.join('plugins', d, '__init__.py')):
                  plugins[d] = {'enabled': True, 'version': '1.0.0', 'source': 'local'}
          json.dump({'plugins': plugins}, open('plugins/plugins.json', 'w'))
          "

      - name: Run database migrations
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://vbwd:vbwd@localhost:5432/vbwd_test
        run: alembic upgrade heads

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://vbwd:vbwd@localhost:5432/vbwd_test
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://vbwd:vbwd@localhost:5432/vbwd_test
        run: |
          pytest tests/unit/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  integration:
    name: Integration Tests
    needs: unit
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vbwd
          POSTGRES_PASSWORD: vbwd
          POSTGRES_DB: vbwd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install plugins (active set — 17 plugins)
        # Payment scope (2026-05-28 decision): demo instances only use
        # stripe + paypal + token_payment + invoice (core). The other 7
        # payment plugins (c2p2, conekta, mercado_pago, promptpay,
        # toss_payments, truemoney, yookassa) are FROZEN — repos kept
        # on the org for archival but excluded from CI + deploy until
        # someone explicitly un-freezes them. See
        # docs/dev_log/20260528/reports/01-payment-scope-freeze.md.
        # S15 — fail fast on any clone failure.
        # Naming: snake-cased local dir; ``token_payment`` is the one
        # kebab-cased repo (vbwd-plugin-token-payment).
        run: |
          set -euo pipefail
          declare -A REPO_OVERRIDES=(
            [token_payment]=token-payment
          )
          BACKEND_PLUGINS="analytics booking chat checkout cms discount email ghrm mailchimp meinchat paypal shipping_flat_rate shop stripe subscription tarot token_payment"
          for dir_name in $BACKEND_PLUGINS; do
            suffix="${REPO_OVERRIDES[$dir_name]:-$dir_name}"
            git clone --depth=1 \
              "https://github.com/VBWD-platform/vbwd-plugin-${suffix}.git" \
              "plugins/${dir_name}" \
              || { echo "::error::Failed to clone plugin ${dir_name} (repo vbwd-plugin-${suffix})"; exit 1; }
          done

      - name: Create plugins.json
        # Enable every cloned plugin at runtime so their on_enable hooks fire —
        # registering catalog seeders, the CMS backfill, etc. Without this the
        # integration app boots with no plugins enabled and DemoSeeder.run()
        # seeds 0 rows (test_reset_demo_end_to_end). Mirrors the unit job.
        run: |
          python3 -c "
          import json, os
          plugins = {}
          for d in os.listdir('plugins'):
              if os.path.isfile(os.path.join('plugins', d, '__init__.py')):
                  plugins[d] = {'enabled': True, 'version': '1.0.0', 'source': 'local'}
          json.dump({'plugins': plugins}, open('plugins/plugins.json', 'w'))
          "

      - name: Run database migrations
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://vbwd:vbwd@localhost:5432/vbwd_test
        run: |
          alembic upgrade heads

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://vbwd:vbwd@localhost:5432/vbwd_test
          # The app defaults VBWD_VAR_DIR to the container path /app/var, which
          # the bare ubuntu-latest runner cannot create/write (PermissionError:
          # '/app'). Point it at a writable workspace dir so the config-currency
          # projection + reset-demo seeding (which persist under VBWD_VAR_DIR)
          # work here the same as in the Docker gate.
          VBWD_VAR_DIR: ${{ github.workspace }}/var
        run: |
          mkdir -p "${{ github.workspace }}/var"
          pytest tests/integration/ -v --tb=short \
            --ignore=tests/integration/test_infrastructure.py
