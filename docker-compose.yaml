services:
  api:
    build:
      context: .
      dockerfile: container/python/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      # Local/integration-test server: don't enforce the prod auth rate caps
      # (S90 G5) — the integration suite does many fixture logins against this
      # live API and would otherwise hit 429. Prod uses a different compose and
      # leaves this unset (defaults ON). Override here if you want to test limits.
      - RATELIMIT_ENABLED=${RATELIMIT_ENABLED:-false}
      # Gunicorn worker timeout. The S48.1 load-shedding default (30s) is too
      # low for synchronous LLM endpoints (cms-ai generate, bot replies, S97/S98)
      # which legitimately take 30-60s+ — a request exceeding it is SIGKILLed →
      # nginx 502 → e.g. an article generates no body. nginx already allows 300s
      # on /api/v1/plugins/cms-ai/; match it here. Override per deployment.
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vbwd:vbwd@postgres:5432/vbwd}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@example.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-VBWD}
      # Enable mock GitHub client for local dev/test — never set this in production
      - GHRM_USE_MOCK_GITHUB=${GHRM_USE_MOCK_GITHUB:-true}
      # Server-side plugin management — the backend owns the authoritative
      # manifest for every VBWD app (its own plugins, fe-admin, fe-user).
      # Paths below live inside the container under /app/var, which is
      # bind-mounted from ${VBWD_VAR_DIR} on the host — the same directory
      # is mounted into fe-admin and fe-user so all three containers read
      # the same files. No plugin state is kept in container images or in
      # browser localStorage.
      - VBWD_VAR_DIR=/app/var
      - VBWD_BACKEND_PLUGINS_JSON=/app/var/plugins/backend-plugins.json
      - VBWD_BACKEND_PLUGINS_CONFIG_JSON=/app/var/plugins/backend-plugins-config.json
      - VBWD_FE_ADMIN_PLUGINS_JSON=/app/var/plugins/fe-admin-plugins.json
      - VBWD_FE_ADMIN_PLUGINS_CONFIG_JSON=/app/var/plugins/fe-admin-plugins-config.json
      - VBWD_FE_USER_PLUGINS_JSON=/app/var/plugins/fe-user-plugins.json
      - VBWD_FE_USER_PLUGINS_CONFIG_JSON=/app/var/plugins/fe-user-plugins-config.json
      # APNs push notifications (S66). Unset = pushes disabled (no-op send,
      # one boot warning) — dev/CI work without Apple credentials.
      - VBWD_APNS_KEY_PATH=${VBWD_APNS_KEY_PATH:-}
      - VBWD_APNS_KEY_ID=${VBWD_APNS_KEY_ID:-}
      - VBWD_APNS_TEAM_ID=${VBWD_APNS_TEAM_ID:-}
      - VBWD_APNS_BUNDLE_ID=${VBWD_APNS_BUNDLE_ID:-}
      - VBWD_APNS_USE_SANDBOX=${VBWD_APNS_USE_SANDBOX:-true}
    volumes:
      - .:/app
      # Shared plugin state directory (default: ../var relative to
      # vbwd-backend/). Override by exporting VBWD_VAR_DIR before running
      # docker compose up. Must match whatever fe-admin / fe-user mount.
      - ${VBWD_VAR_DIR:-../var}:/app/var
      # APNs .p8 signing key (S66): mount the Apple key file READ-ONLY as a
      # secret and point VBWD_APNS_KEY_PATH at it. NEVER commit the key or
      # bake it into an image. Example:
      #   - /secure/host/path/AuthKey_ABCDE12345.p8:/run/secrets/apns_key.p8:ro
      # with VBWD_APNS_KEY_PATH=/run/secrets/apns_key.p8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # S48.1 invariant: workers x (pool_size + max_overflow) + reserve <= this.
    # Defaults (4 workers x 20 conns = 80) fit with ample reserve. Real
    # horizontal scale uses pgbouncer (S48.4) — do NOT just raise this number.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vbwd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vbwd}
      POSTGRES_DB: ${POSTGRES_DB:-vbwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vbwd} -d ${POSTGRES_DB:-vbwd}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  test:
    build:
      context: .
      dockerfile: container/python/Dockerfile.test
    environment:
      PYTHONPATH: /app
      FLASK_ENV: testing
      DATABASE_URL: "postgresql://vbwd:vbwd@postgres:5432/vbwd"
      REDIS_URL: "redis://redis:6379/1"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - test

  # Integration tests with real PostgreSQL and HTTP requests
  test-integration:
    build:
      context: .
      dockerfile: container/python/Dockerfile.test
    environment:
      PYTHONPATH: /app
      FLASK_ENV: testing
      # Use PostgreSQL for integration tests
      DATABASE_URL: "postgresql://vbwd:vbwd@postgres:5432/vbwd"
      REDIS_URL: "redis://redis:6379/1"
      # Test data configuration
      TEST_DATA_SEED: "${TEST_DATA_SEED:-true}"
      TEST_DATA_CLEANUP: "${TEST_DATA_CLEANUP:-false}"
      TEST_USER_EMAIL: "${TEST_USER_EMAIL:-test@example.com}"
      TEST_USER_PASSWORD: "${TEST_USER_PASSWORD:-TestPass123@}"
      TEST_ADMIN_EMAIL: "${TEST_ADMIN_EMAIL:-admin@example.com}"
      TEST_ADMIN_PASSWORD: "${TEST_ADMIN_PASSWORD:-AdminPass123@}"
      # API URL for HTTP integration tests
      API_BASE_URL: "http://api:5000/api/v1"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    profiles:
      - test-integration

volumes:
  postgres_data:
