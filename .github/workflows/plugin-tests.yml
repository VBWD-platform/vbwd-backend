name: Plugin Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit — ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every published vbwd-plugin-* repo (24 total). Plugins without
        # unit tests are skipped gracefully by pre-commit-check.sh.
        plugin:
          - analytics
          - booking
          - c2p2
          - chat
          - checkout
          - cms
          - conekta
          - discount
          - email
          - ghrm
          - mailchimp
          - meinchat
          - mercado_pago
          - paypal
          - promptpay
          - shipping_flat_rate
          - shop
          - stripe
          - subscription
          - taro
          - token_payment
          - toss_payments
          - truemoney
          - yookassa

    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vbwd, POSTGRES_PASSWORD: vbwd, POSTGRES_DB: vbwd_test }
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Install plugin
        # Local dir name is snake; some repos use kebab — handle via override map.
        run: |
          set -euo pipefail
          declare -A REPO_OVERRIDES=(
            [mercado_pago]=mercado-pago
            [token_payment]=token-payment
            [toss_payments]=toss-payments
          )
          dir_name="${{ matrix.plugin }}"
          suffix="${REPO_OVERRIDES[$dir_name]:-$dir_name}"
          git clone --depth=1 -q \
            "https://github.com/VBWD-platform/vbwd-plugin-${suffix}.git" \
            "plugins/${dir_name}"
      - name: Install plugin deps
        # Declared plugin→plugin deps (PluginMetadata.dependencies). Adds each
        # required peer plugin so the under-test plugin's on_enable doesn't
        # fail dependency resolution.
        run: |
          set -euo pipefail
          declare -A REPO_OVERRIDES=(
            [mercado_pago]=mercado-pago
            [token_payment]=token-payment
            [toss_payments]=toss-payments
          )
          declare -A DEPS=(
            [taro]="chat"
            [stripe]="subscription"
            [paypal]="subscription"
            [yookassa]="subscription"
            [meinchat]="subscription"
          )
          deps_for_this="${DEPS[${{ matrix.plugin }}]:-}"
          for dep in $deps_for_this; do
            suffix="${REPO_OVERRIDES[$dep]:-$dep}"
            [ -d "plugins/${dep}" ] || git clone --depth=1 -q \
              "https://github.com/VBWD-platform/vbwd-plugin-${suffix}.git" \
              "plugins/${dep}"
          done
      - name: Run lint + unit
        env: { PYTHONPATH: "${{ github.workspace }}", REDIS_URL: "redis://localhost:6379/0", DATABASE_URL: "postgresql://vbwd:vbwd@localhost:5432/vbwd_test" }
        run: ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --quick

  integration:
    name: Integration — ${{ matrix.plugin }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [booking, cms, email, ghrm, taro]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Install ALL plugins (full SDK — all 24 published plugins)
        run: |
          set -euo pipefail
          declare -A REPO_OVERRIDES=(
            [mercado_pago]=mercado-pago
            [token_payment]=token-payment
            [toss_payments]=toss-payments
          )
          BACKEND_PLUGINS="analytics booking c2p2 chat checkout cms conekta discount email ghrm mailchimp meinchat mercado_pago paypal promptpay shipping_flat_rate shop stripe subscription taro token_payment toss_payments truemoney yookassa"
          for dir_name in $BACKEND_PLUGINS; do
            suffix="${REPO_OVERRIDES[$dir_name]:-$dir_name}"
            git clone --depth=1 -q \
              "https://github.com/VBWD-platform/vbwd-plugin-${suffix}.git" \
              "plugins/${dir_name}" 2>/dev/null || true
          done
      - name: Create plugins.json (enable all plugins)
        run: |
          python3 -c "
          import json, os
          plugins = {}
          for d in os.listdir('plugins'):
              init = os.path.join('plugins', d, '__init__.py')
              if os.path.isfile(init):
                  plugins[d] = {'enabled': True, 'version': '1.0.0', 'source': 'local'}
          json.dump({'plugins': plugins}, open('plugins/plugins.json', 'w'))
          print(f'Created plugins.json with {len(plugins)} plugins: {sorted(plugins.keys())}')
          "
      - name: Start full stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/v1/health > /dev/null 2>&1 && break; sleep 2; done
      - name: Run integration tests
        run: docker compose run --rm test ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --integration
      - name: Cleanup
        if: always()
        run: docker compose down -v
