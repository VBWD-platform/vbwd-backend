name: Plugin Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit — ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Active payment scope (2026-05-28): demo instances only use
        # stripe + paypal + token_payment + invoice. The 7 frozen payment
        # plugins (c2p2, conekta, mercado_pago, promptpay, toss_payments,
        # truemoney, yookassa) are excluded from CI. See
        # docs/dev_log/20260528/reports/01-payment-scope-freeze.md.
        # Plugins without unit tests skip gracefully via pre-commit-check.sh.
        plugin:
          - analytics
          - booking
          - chat
          - checkout
          - cms
          - discount
          - email
          - ghrm
          - license_authority
          - mailchimp
          - meinchat
          - paypal
          - shipping_flat_rate
          - shop
          - stripe
          - subscription
          - tarot
          - token_payment

    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vbwd, POSTGRES_PASSWORD: vbwd, POSTGRES_DB: vbwd_test }
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Configure private plugin auth
        # Private plugin repos (e.g. license_authority) clone via a fine-grained
        # PAT secret; public repos keep working when the secret is absent.
        env:
          PLUGIN_PAT: ${{ secrets.PLUGIN_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${PLUGIN_PAT:-}" ]; then
            git config --global \
              url."https://x-access-token:${PLUGIN_PAT}@github.com/".insteadOf \
              "https://github.com/"
          fi
      - name: Install plugin
        # Local dir name is snake; ``token_payment`` is the one kebab-cased repo.
        run: |
          set -euo pipefail
          declare -A REPO_OVERRIDES=(
            [token_payment]=token-payment
            [license_authority]=license-authority
          )
          dir_name="${{ matrix.plugin }}"
          suffix="${REPO_OVERRIDES[$dir_name]:-$dir_name}"
          git clone --depth=1 -q \
            "https://github.com/VBWD-platform/vbwd-plugin-${suffix}.git" \
            "plugins/${dir_name}"
      - name: Install plugin deps
        # Declared plugin→plugin deps (PluginMetadata.dependencies). Adds each
        # required peer plugin so the under-test plugin's on_enable doesn't
        # fail dependency resolution — without them PluginManager refuses to
        # enable it, no blueprint mounts, and every route test sees 404.
        #
        # The set is read from the plugins themselves (ci/missing_plugin_deps.py)
        # rather than a hand-kept table, which had drifted: subscription gained
        # a dependency on `email` that the table never picked up, and that one
        # gap failed 59 tests across the meinchat, tarot, subscription and ghrm
        # jobs. Loops because dependencies are transitive.
        run: |
          set -euo pipefail
          UNDER_TEST="${{ matrix.plugin }}"
          attempted=""
          for _attempt in 1 2 3 4 5; do
            missing="$(python ci/missing_plugin_deps.py --for "$UNDER_TEST")"
            if [ -z "$missing" ]; then
              break
            fi
            progressed=""
            for dep in $missing; do
              dir_name="${dep//-/_}"
              if [ -d "plugins/${dir_name}" ]; then
                continue
              fi
              case " ${attempted} " in *" ${dir_name} "*) continue ;; esac
              attempted="${attempted} ${dir_name}"
              # Repo naming is not fully consistent (vbwd-plugin-bot-base but
              # vbwd-plugin-shipping_flat_rate), so try both spellings.
              for suffix in "${dep//_/-}" "${dep//-/_}"; do
                if git clone --depth=1 -q \
                    "https://github.com/VBWD-platform/vbwd-plugin-${suffix}.git" \
                    "plugins/${dir_name}" 2>/dev/null; then
                  echo "Cloned peer plugin '${dep}' from vbwd-plugin-${suffix}"
                  progressed=1
                  break
                fi
              done
            done
            [ -n "$progressed" ] || break
          done
          # Not every peer is reachable — meinchat's tests reference the private
          # meinchat-plus and skip when it is absent. Report what was dropped
          # (never silently) and let the suite speak for whether it mattered.
          unresolved="$(python ci/missing_plugin_deps.py --for "$UNDER_TEST" | tr '\n' ' ')"
          if [ -n "${unresolved// /}" ]; then
            echo "::warning::peer plugins not checked out (private or absent): ${unresolved}"
          fi
          echo "Plugin set: $(ls -d plugins/*/ | xargs -n1 basename | tr '\n' ' ')"
      - name: Run lint + unit
        env: { PYTHONPATH: "${{ github.workspace }}", REDIS_URL: "redis://localhost:6379/0", DATABASE_URL: "postgresql://vbwd:vbwd@localhost:5432/vbwd_test" }
        run: ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --quick

  integration:
    name: Integration — ${{ matrix.plugin }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [booking, cms, email, ghrm, license_authority, tarot]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Configure private plugin auth
        env:
          PLUGIN_PAT: ${{ secrets.PLUGIN_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${PLUGIN_PAT:-}" ]; then
            git config --global \
              url."https://x-access-token:${PLUGIN_PAT}@github.com/".insteadOf \
              "https://github.com/"
          fi
      - name: Install ALL plugins (active set — 18 plugins)
        # Same scope as the unit matrix above; see the freeze note there.
        run: |
          set -euo pipefail
          declare -A REPO_OVERRIDES=(
            [token_payment]=token-payment
            [bot_base]=bot-base
            [bot_telegram]=bot-telegram
            [license_authority]=license-authority
          )
          BACKEND_PLUGINS="analytics booking bot_base bot_telegram chat checkout cms discount email ghrm license_authority mailchimp meinchat paypal shipping_flat_rate shop stripe subscription tarot token_payment"
          for dir_name in $BACKEND_PLUGINS; do
            suffix="${REPO_OVERRIDES[$dir_name]:-$dir_name}"
            git clone --depth=1 -q \
              "https://github.com/VBWD-platform/vbwd-plugin-${suffix}.git" \
              "plugins/${dir_name}" 2>/dev/null || true
          done
      - name: Create plugins.json (enable all plugins)
        # Keys must be PluginMetadata.name, not the directory — they differ for
        # the bot plugins (bot_base -> "bot-base") and a mismatched key is
        # ignored at load time, so the plugin never enables and its routes 404.
        run: python ci/write_plugins_manifest.py
      - name: Start full stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/v1/health > /dev/null 2>&1 && break; sleep 2; done
      - name: Run integration tests
        run: docker compose run --rm test ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --integration
      - name: Cleanup
        if: always()
        run: docker compose down -v
